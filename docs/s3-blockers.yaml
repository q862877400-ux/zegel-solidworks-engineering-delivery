# S3 阻塞台账（**机器可校验**，不是散文）
#
# 用途: scripts/check_s3_blockers.py 拿这份台账与机器生成的
#       specs/350-first-part-delivery/s3-acceptance.md 做**双向校验**。
#
# ## 为什么需要它
#
# 第 20–31 轮之间反复出现同一类失效：**一条断言（不管是「已验成」还是「已阻塞」）
# 写进文档后就不再被核对**，于是可能长期陈旧：
#   · 事实 422 说 AddHorizontalDimension2 已验成 —— 22 天后复跑失败（事实 560）
#   · 第 26 轮报「异型孔向导单点通过」，第 27 轮同一段实参复现不出来
#   · 第 28 轮孔型合并把枚举当词表，被「要求为空」掩盖到第 31 轮
#
# ⇒ 把「阻塞」也变成机器可判的双向契约：
#   · 报告里有不合格项、台账里没写 ⇒ 红（会被当成「没跑」）
#   · 台账里写了、报告里已不在不合格项 ⇒ 红（陈旧阻塞，问题解决却没删）
#
# ## 字段
#   check_id: 必须与 s3-acceptance.md 里的 check_id 逐字一致
#   cause:    封闭词表 —— toolchain（工具链退化）/ requirement（缺需求输入）/ environment
#   owner:    谁能解 —— agent（我可试）/ user（只有用户能给）
#   summary:  一句话说清卡在哪
#   evidence: 证据文件路径（仓库相对，必须存在）

blockers:
  - check_id: E2.hole_readback
    cause: requirement
    owner: user
    summary: >-
      要求里的孔型为空。孔型现在测得出来（hole_params → through），
      但「要求什么孔型」没冻结 —— 属 S2 的 interface 项。
      拿实测值回填 requested 是循环论证（产物当要求），不做。
    evidence:
      - specs/350-first-part-delivery/s2-question-sheet.md
      - specs/350-first-part-delivery/requirements.md

  - check_id: E1.sketches
    cause: toolchain
    owner: agent
    summary: >-
      ★ 10 张草图里有 **4 张欠定义**（状态 2）—— 正好是四个孔特征各自的「孔点草图」。
      孔点只被约束了一个方向，另一个方向可以拖动（业主 2026-10-26 当场指出）。
      ⇒ 原来的 `E1` 只读**主草图**、判了 pass，**看不见孔草图**；
        已补 `E1.sketches` 逐个草图判（本项就是它暴露出来的）。
      修法：重建板件 —— 一个孔特征 + 四个**两向都定位**的孔点（+ 标准改 GB）。
      ★ 第 72 轮进展：删旧孔（`sw_part.feature_delete`，4→0）· 建点（新封装
        `sw_part.sketch_point`）· 选中四点 都已验证；
        **卡在两处**：`fully_define_sketch` 回 True 但草图仍状态 2（该封装取值表未核实）；
        `HoleWizard5` 用 GB(13)+fastener 40 没建出特征，而 `GetFastenerTypes` 对所有标准
        回 0 条 ⇒ 疑点在我的调用方式，**不能据此断言 GB 没装**。详见事实 581。
      ★ 第 73 轮：**尺寸创建这道墙没打通** —— 三条尺寸成员 × 四种选择写法（含按位置选、
        含 ESC 线程、含不设 CommandInProgress）**一律回 None**，草图停在状态 2。
        ⇒ 「孔点两向全约束」当时未实现。
      ★★ 第 74 轮**已定位根因**（事实 583）：`IModelDocExtension.AddDimension` 是 **4 参**，
        缺第 4 参 `Direction` 抛 `DISP_E_PARAMNOTOPTIONAL`；补上后返回真 `IDisplayDimension`。
        ★ 且发现**圆能标尺寸、裸点不能** ⇒ 孔位改用圆。
        下一步：4 个圆 × 两向位置尺寸 + 半径（或 `sgSAMEAS` 等半径）+ 一次 HoleWizard(GB)。
    evidence:
      - output/s3-acceptance.json
      - docs/known-facts.md
      - tools/run_s3_acceptance.py

  - check_id: E2.drawing_current
    cause: requirement
    owner: user
    summary: >-
      图纸修订与模型修订一致这一项**还没验**：首件当前还没有图。
      第 41 轮把这条从 E2 主判据里拆成独立 check_id
      （原来它是调用方布尔，且被「下游没联动」的 fail 遮住），
      现在如实报 unknown。要判它需要先出图，而出图范围属 S2 的 drawing_scope（未冻结）。
    evidence:
      - specs/350-first-part-delivery/s2-question-sheet.md
      - specs/350-first-part-delivery/requirements.md
      - tests/test_acceptance_e2_drawing_split.py

  - check_id: E4.dof
    cause: toolchain
    owner: agent
    summary: >-
      SolidWorks **没有数值自由度读取入口**（三源确认：1032 接口 / 20627 成员零命中）
      ⇒ 这一项在本机**永远只能是 unknown**，不是产物问题。
      判据侧已拆成 E4.dof / E4.interference 两条，让「验不了」与「不合格」分得开。
    evidence:
      - specs/350-first-part-delivery/source-verification.md
      - specs/350-first-part-delivery/STATUS.md
      - tests/test_acceptance_e4_split.py

  - check_id: E5.drawing
    cause: requirement
    owner: user
    summary: >-
      首件**还没有工程图** ⇒ `collect_drawing` 的必备项与装订项都是空、两个修订号都空
      ⇒ 采集不完整 ⇒ unknown（不是 fail）。
      另外「图样应该包含哪些视图/标注」属 S2 的 `drawing_scope`，未冻结前判据无法定阈值。
    evidence:
      - specs/350-first-part-delivery/STATUS.md
      - specs/350-first-part-delivery/s2-question-sheet.md
      - scripts/engineering/acceptance/e5_e6_drawing.py

  - check_id: E6.process
    cause: requirement
    owner: user
    summary: >-
      工艺路线未冻结（S2 的 `process`）⇒ `required_checks` 无从给 ⇒ 采集 complete=False
      ⇒ unknown（不是 fail）。
      ★ `judge_process` 已有「一条适用项都没有就不通过」，不得靠列「不适用」绕过。
    evidence:
      - specs/350-first-part-delivery/s2-question-sheet.md
      - scripts/engineering/acceptance/e5_e6_drawing.py

