      "limitations": [
        "不能调用官方标记为仅进程内非托管 C++ 的指针接口",
        "长期事件回调和复杂 UI 生命周期不作为首选",
        "**具体化的实例（2026-10-01 实测）**：`ISketchedBendFeatureData` 的 `AccessSelections(Object, Object)` 与 `SetFixedFace(Double, Double, Double, Object)` 在 pywin32 迟到绑定下**不可调用** —— `SetFixedFace` 的**七种数组包装 × 两个重载**全部报 `类型不匹配`（位置 1 或 4）；`AccessSelections(model, None)` 报 `类型不匹配`（位置 2）、改传 `VARIANT(VT_DISPATCH, None)` 报 **`服务器出现意外情况`（`0x80010105`）**（与 `IModeler.CreateBsplineSurface` 同码）。反射里那对 `IAccessSelections` / `IAccessSelections2` 正是本限制说的**指针变体**。⇒ **受此影响：`sw_sheet_metal` 的 `create_one_bend` / `create_edge_flange` / `create_gusset` 在这条后端上到不了「建成」**（另有 `create_draft` 的常量不在官方 35 个内）。**⚠ 「换个参数试试」已穷尽（20+ 种），不要再试。**",
        "**第二类具体化实例（2026-10-01 轮 186 实测）：`ISafeArrayUtility` 是**给 C++ 的**，pywin32 到不了** —— 一条外部评审把它列为「高杠杆缺口」（说官方给了数组工具集而我们到处手搓 `VARIANT(...)`），★ **实测否定**：`tools/probe_safearray_utility.py`（CommandInProgress 置位、不开文档、收尾轮询点掉）——① `ISldWorks.GetSafeArrayUtility()` **返回 `CDispatch`（对象拿得到）**；② 官方登记的**全部 21 个成员**逐个试 ⇒ **迟到绑定可达 0/21**（每个都 `AttributeError: <unknown>.X`）；③ 类型信息内省 ⇒ `com_error: (-2147352565, '无效索引。')` ⇒ **没有可用的 dispinterface**；④ 官方 `_overview.md` 的 Remarks 原话：「The ISafeArrayUtility interface replaces the SOLIDWORKS **SafeArray template class**, which you might have used in earlier versions of SOLIDWORKS to instantiate SafeArrays for methods requiring Variant arrays in **your C++ projects**。」⇒ ★★ 与本后端**第一类实例（事实 47 的 `IAccessSelections` / `SetFixedFace`）同一族**。★★★ **推论（重要）**：官方 md 明写它是**取代 C++ 的 SafeArray 模板类** —— 即在脚本语言里「本就有原生数组」⇒ 它**不是**本项目手搓 `VARIANT(VT_ARRAY|...)` 的替身。⚠ **不要再把它当「该补的缺口」**：它不到「编目录」以下任何一级。⚠ **另记一个被证伪的静态信号**：曾以为「`IX` 有成员而其无 `I` 孪生段为空 ⇒ 迟到绑定到不了」，实测**证伪** —— 1032 个接口段里 504 对有孪生、**502 对的孪生是空的**，而其中包含`ISldWorks` / `IModelDoc2` / `IFeatureManager` / `ISketchManager` / `ISelectionMgr` / `IFace2`**这些全都能用** ⇒ ☆ 该信号若做成门禁会**同时**给出 502 个假阳性。★ **判据只能用真机逐接口穷尽枚举**（与事实 47 的结论一致）。  ⚠⚠⚠ **2026-10-01（轮 188）更正上面这一段的措辞** —— 「到不了」**过强**，必须**带绑定层次**限定：\n```\n· pywin32 **迟到绑定**：21 个成员 0/21 可达 + 无 dispinterface ⇒ **到不了**（这半是对的）\n· comtypes **早绑定**（走 sldworks.tlb 类型库）：`tools/probe_safearray_comtypes.py` 实测 ——\n  ① comtypes.client.GetActiveObject('SldWorks.Application') **附着**到**同一个**运行实例\n     （comtypes PID 20456 ⇒ 与运行中的那个同一个；**没起第二个实例** —— 红线：事实 24）\n  ② 类型库模块 comtypes.gen.SldWorks 里**有** ISafeArrayUtility\n  ③ ★★★ **QueryInterface(ISafeArrayUtility) 成功** ⇒ 对象**真的实现**那个 vtable 接口\n⇒ ★★ 所以「接口不存在 / 到不了」是**错的**；正确的是「**pywin32 迟到绑定看不到它**」\n⚠ 但**往返仍未走通**：PutDouble(arr, 0, 1.5) 不报错（类型库说它确实要 3 参、\n  且 VariantArray 是 in,out），而 arr.value=None、GetDouble 读回 0.0\n  ⇒ **in,out 的 VARIANT 数组没回写**（与事实 68 同族）⇒ 按事实 53 不继续凑形态\n★★ **而无论走不走得通，它对我们都没有新增能力** —— 证据（同一探针 ⑥）：\n  pywin32 的 `VARIANT(VT_ARRAY|VT_R8, [...])` 与 `VARIANT(VT_ARRAY|VT_DISPATCH, [...])`\n  **本来就能构造数组**（事实 123 / 167 就是这么修的）⇒\n  ★ 它是**给 C++ 弥补「没有原生数组」**的，脚本语言的绑定层**已经替我们做了**\n```\n⇒ ★★ **结论（本后端仍然「不做」）**：不是「够不到」，而是「**够得到但没有净收益**」——\n 且**修正后的措辞**才是可引用的（不带层次的「到不了」会被人当成「官方没这个能力」）。\n"
      ]
