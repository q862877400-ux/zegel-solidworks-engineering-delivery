- id: L3-004
  requirement: 给一块 80×60×10 的板做 2mm 抽壳
  category: solvable
  split: dev
  labels:
    function: 减重
    interface: 开口面
    question: 缺 **抽壳的开口面**（哪个面挖掉）
    result: WAITING_INPUT
  needs_owner_judgment: true
  notes: 标签是 AI 起草，需业主确认
  steps_cn:
  - 在前视基准面开始画草图
  - 用矩形工具画一个 80×60 的矩形
  - 用尺寸工具约束成 80×60
  - 退出草图，拉伸 10 毫米
  - 用抽壳工具设壁厚 2 毫米，选顶面作为开口面
  - 读回体积（= 48000 − 内腔）
