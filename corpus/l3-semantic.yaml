- id: L3-008
  requirement: 在一块 120×80×15 的板上做一条半圆端槽（长 40，宽 10）
  category: solvable
  split: dev
  labels:
    function: 导向
    interface: 槽两端
    question: 缺 **槽的位置**（在板的哪里）
    result: WAITING_INPUT
  needs_owner_judgment: true
  notes: 标签是 AI 起草，需业主确认
  steps_cn:
  - 在前视基准面开始画草图
  - 用矩形工具画一个 120×80 的矩形
  - 用尺寸工具约束成 120×80
  - 退出草图，拉伸 15 毫米成板
  - 在板的顶面新建草图
  - 用槽口工具画一条半圆端槽，长 40、宽 10
  - 用尺寸工具约束槽长 40、槽宽 10
  - 退出草图，用拉伸切除贯穿板厚
  - 读回体积（= 144000 − 槽体积）
  sketch_definition:
    sketch: ① 矩形草图 + ② 槽口草图（板的顶面）
    origin: ① 矩形左下角↔原点 重合 · ② ★ 槽的**中心线↔矩形中心**（用**对称**关系，★ 不用 1/2 尺寸 —— 见协议 §5）
    dims:
    - ① 120 × 80
    - ② **槽长 40** —— ★ 必须说清口径：**圆弧中心至圆弧中心**（官方 2026 SP1）
    - ② **槽宽 10** = 标**圆弧半径 R5**（★ 两圆弧自带相等 ⇒ 标一个就够）
    - ② ★ 槽的**定位**：用**对称**关系（不用 1/2 尺寸）⇒ 改槽宽时保持居中
    relations:
    - ① 矩形工具自带：平行 · 垂直 · 重合；补：左下角↔原点
    - ② 槽口工具自带：两圆弧**相等** · 两直线**平行** · 直线与圆弧**相切**
    - ★ 补 ②：槽中心线 **平行** 于矩形长边（★ 业主批注 4 要的方向关系）
    - ★ 补 ②：槽中心线↔矩形水平中心线 **重合**（或对矩形加**对称**）
    - ★★ 槽口有**四种类型**（`ISketchManager.CreateSketchSlot` · 14 参）—— 本条的「半圆端槽」= **`arc`(2)** 或 **`line`(0)**（★ 要选一种）
    - ★★ 槽长有**两种口径**：`CenterCenter`(0) = 圆弧中心之间 · `FullLength`(1) = 全长 ⇒ ★ **本条需求写「长 40」⇒ 必须问是哪一种**
    - ★★★ **优先稳定基准、全约束草图和命名特征**；**禁止依赖 `Edge1`、屏幕坐标或偶然选择顺序**（★ 逐字承 `references/complex-mechanical-routing.md`）
    - ★★★★★ **落地顺序：建一条线 → 立刻加 H/V → 再建下一条** （★ 逐字承两份手册 · 实测 **6 水平只成 3、6 垂直 0 全错**）—— ★ 原因 = 约束工具靠「离 (px,py) 最近的线段」选目标 ⇒ ★ **一条一条加**时草图里只有那一条线，**天然无歧义**
    tool_builtin: 槽口工具自带相等/平行/相切 ⇒ ★ 欠**位置**与**方向**
    expected_status: 3
    _status_note: ★ 判据：`solidworks_sketch_fully_defined_status` 回 3 = 完全定义（★ 本仓真机读数：2=欠定义 · 3=完全定义）
    relation_source: ★ 手写（★ **待迁移到生成器** —— ★ 见 `sketch_relations_gen`）
