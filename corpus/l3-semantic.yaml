  - 让**圆心**落在原点，画一个 φ6 的圆
  - 用尺寸工具把圆约束成 φ6
  - 退出草图，拉伸 30 毫米成圆柱销
  - 用倒角工具选两端圆的两条边缘线，倒角边长 1 毫米
  - 读回体积（≈ π×9×30 − 两端倒角）
