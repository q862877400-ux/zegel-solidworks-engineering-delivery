- id: L3-001
  requirement: 在一块 100×60×20 的板上四角各打一个 M6 通孔，孔心距边 10mm
  category: solvable
  split: dev
  labels:
    function: 承载
    interface: 四角孔位
    question: 无
    result: READY_FOR_REVIEW
  needs_owner_judgment: true
  notes: 标签是 AI 起草，需业主确认
  steps_cn:
  - 在前视基准面开始画草图
  - 用矩形工具画一个 100×60 的矩形（左下角在原点）
  - 用尺寸工具把两条边约束成 100 和 60
  - 退出草图，把矩形拉伸成 20 毫米厚的板
  - 用异型孔向导在四角各打一个 M6 通孔，孔心距两边各 10 毫米
  - 读回体积与孔数
  sketch_definition:
    sketch: 矩形草图（前视基准面）
    origin: 矩形**左下角**与原点**重合**
    dims:
