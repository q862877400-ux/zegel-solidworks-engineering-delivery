    tool_builtin: 矩形工具**自带**平行+垂直+重合 ⇒ ★ 只欠**位置**与**大小**
    expected_status: 3
    _status_note: ★ 判据：`solidworks_sketch_fully_defined_status` 回 3 = 完全定义（★ 本仓真机读数：2=欠定义 · 3=完全定义）
    relation_source: ★★ **生成器**（`scripts/engineering/sketch_relations_gen.py`）—— ★ 输入只有顶点坐标 ⇒ ★ 换形状**不用改代码**
    relation_string: horizontal:0;vertical:1;horizontal:2;vertical:3;coincident:0,1;coincident:1,2;coincident:2,3;coincident:3,0;perpendicular:0,1;parallel:0,2;perpendicular:0,3;perpendicular:1,2;parallel:1,3;perpendicular:2,3
