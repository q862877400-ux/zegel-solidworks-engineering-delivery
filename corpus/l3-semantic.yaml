- id: L3-020
  requirement: 在一块 200×100×12 的板上做一排 3 个 M6 通孔，间距 30mm
  category: solvable
  split: blind
  labels:
    function: 连接
    interface: 孔列
    question: 缺 **这排孔距边的位置**
    result: WAITING_INPUT
  needs_owner_judgment: true
  notes: 标签是 AI 起草，需业主确认
  steps_cn:
  - 在前视基准面开始画草图
  - 用矩形工具画一个 200×100 的矩形
  - 用尺寸工具约束成 200×100
  - 退出草图，拉伸 12 毫米成板
  - 在板上打一个 M6 通孔，然后按间距 30 毫米线性阵列成 3 个
  - 读回孔数、孔径与孔间距
  sketch_definition:
    sketch: ① 矩形草图 + ② 孔点草图（板的顶面）
    origin: ① 矩形左下角↔原点 · ② ★ 首个孔点锚到矩形（对称或定位尺寸）
    dims:
    - ① 200 × 100
    - ② 孔 φ6 · 间距 30
    relations:
    - ① 矩形自带 + 补原点
    - ② ★ 3 个孔点**水平**（保证同一条线上）
    - ② ★ 相邻孔点间距 30（线性阵列会自动生成，★ 只需定义种子）
    - ★★ 通孔用 **`FeatureCut4(..., T1=1)`**（贯穿），★ 不是「厚度+1mm」的盲孔
    - ★★★ **优先稳定基准、全约束草图和命名特征**；**禁止依赖 `Edge1`、屏幕坐标或偶然选择顺序**（★ 逐字承 `references/complex-mechanical-routing.md`）
    - ★★★★★ **落地顺序：建一条线 → 立刻加 H/V → 再建下一条** （★ 逐字承两份手册 · 实测 **6 水平只成 3、6 垂直 0 全错**）—— ★ 原因 = 约束工具靠「离 (px,py) 最近的线段」选目标 ⇒ ★ **一条一条加**时草图里只有那一条线，**天然无歧义**
    tool_builtin: ★ 线性阵列会生成其余 2 个 ⇒ ★ 只需定义**种子孔**
    expected_status: 3
    _status_note: ★ 判据：`solidworks_sketch_fully_defined_status` 回 3 = 完全定义（★ 本仓真机读数：2=欠定义 · 3=完全定义）
    relation_source: ★ 手写（★ **待迁移到生成器** —— ★ 见 `sketch_relations_gen`）
  tools:
  - solidworks_sketch_start
  - solidworks_sketch_add_rectangle
  - solidworks_sketch_end
  - solidworks_extrude_boss
  - solidworks_hole_wizard
  - solidworks_part_mass_properties
  readback:
  - 孔数 = 3
  - 孔径 = 6mm
  - 孔间距 = 30mm
  - ★★ 特征树里是 `ThroughAll`
  - ★★ 同 `L3-001`：贯穿用 `swEndCondThroughAll(1)` + 占位深度 0.01
