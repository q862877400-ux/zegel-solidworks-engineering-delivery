protocol_id: rigid_mechanism_layout
version: 1

#: ★ Q1 五要素之一：**触发条件**
entry_check: requires_supported_rigid_body_motion

inputs_schema: LayoutInputs@1
outputs_schema: LayoutResult@1

required_inputs:
  - target_motion
  - installation_envelope
  - load_cases
  - interface_constraints

checks:
  - hard_requirements_complete@1
  - kinematic_model_supported@1
  - assembly_accessibility@1
  - motion_validation_coverage@1

on_failure:
  missing_critical_input: WAITING_INPUT
  layout_conflict: REVISE_LAYOUT
  unsupported_model: UNSUPPORTED_CAPABILITY

#: ★ Q1 五要素之五：**输出**
outputs:
  - layout_result
  - validation_coverage

source_refs:
  - front_end_workflow
  - scheme_selection
